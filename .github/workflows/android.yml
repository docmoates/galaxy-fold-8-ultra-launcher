name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foldos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Widgets + debug APK
        uses: actions/upload-artifact@v4
        with:
          name: widgetsplus-debug-apk
          path: widgetsplus/build/outputs/apk/debug/widgetsplus-debug.apk
          if-no-files-found: error

  release:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # contents: write lets the tag step below create a GitHub Release.
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Optional release signing. Add these repository secrets to sign with your own key:
      #   FOLDOS_KEYSTORE_BASE64    base64 of the .jks / .keystore file
      #   FOLDOS_KEYSTORE_PASSWORD  keystore password
      #   FOLDOS_KEY_ALIAS          key alias
      #   FOLDOS_KEY_PASSWORD       key password (defaults to the keystore password when empty)
      # Without them (and on pull requests from forks, where secrets are withheld) the build signs
      # with the committed stable key app/foldos-signing.p12, the same key the debug job uses, so
      # every APK from this workflow updates the previous one in place.
      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLDOS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOLDOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOLDOS_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foldos-release.keystore"
            echo "path=$RUNNER_TEMP/foldos-release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release keystore secrets set; the release APK is signed with the committed stable key."
          fi

      - name: Build release APK
        env:
          FOLDOS_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          FOLDOS_KEYSTORE_PASSWORD: ${{ secrets.FOLDOS_KEYSTORE_PASSWORD }}
          FOLDOS_KEY_ALIAS: ${{ secrets.FOLDOS_KEY_ALIAS }}
          FOLDOS_KEY_PASSWORD: ${{ secrets.FOLDOS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: foldos-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Widgets + release APK
        uses: actions/upload-artifact@v4
        with:
          name: widgetsplus-release-apk
          path: widgetsplus/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          asset="$RUNNER_TEMP/FoldOS-${TAG}.apk"
          cp "$apk" "$asset"
          flags=""
          notes="FoldOS ${TAG}. See CHANGELOG.md for what changed."
          if [ "$SIGNED" != "true" ]; then
            flags="--prerelease"
            notes="$notes This APK is signed with the committed project key (no private release keystore configured); it updates other builds signed with the same key in place."
          fi
          widgets=$(ls widgetsplus/build/outputs/apk/release/*.apk | head -n 1)
          widgets_asset="$RUNNER_TEMP/WidgetsPlus-${TAG}.apk"
          cp "$widgets" "$widgets_asset"
          gh release create "$TAG" "$asset" "$widgets_asset" --title "FoldOS ${TAG}" --notes "$notes" $flags
